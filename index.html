<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <script>
      (function () {
        var t = localStorage.getItem('mastplayer-theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'light' ? '#ffffff' : '#070b14');
      })();
    </script>
    <title>MastPlayer — Upload, Share &amp; Monetize Your Videos</title>
    <meta
      name="description"
      content="Upload videos, create shareable links, manage your content and reach viewers anywhere with MastPlayer."
    />
    <link rel="canonical" href="https://mastplayer.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mastplayer.in/" />
    <meta property="og:title" content="MastPlayer — Upload, Share &amp; Monetize Your Videos" />
    <meta
      property="og:description"
      content="Upload videos, create shareable links, manage your content and reach viewers anywhere with MastPlayer."
    />
    <meta property="og:image" content="https://mastplayer.in/icon-192.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MastPlayer — Upload, Share &amp; Monetize Your Videos" />
    <meta
      name="twitter:description"
      content="Upload videos, create shareable links, manage your content and reach viewers anywhere with MastPlayer."
    />
    <meta name="twitter:image" content="https://mastplayer.in/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
